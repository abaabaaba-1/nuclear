exper_name: "Stellarator_VMEC_3_Obj_RVEA_Small"
description: "Small-budget smoke test for RVEA / K-RVEA baselines on VMEC++ (volume, aspect_ratio, magnetic_shear)."
save_dir: "./moo_results/"
save_suffix: "stellarator_vmec_3_obj_rvea_small"

resume: False

model:
  name: zgca,gemini-2.5-flash-nothinking

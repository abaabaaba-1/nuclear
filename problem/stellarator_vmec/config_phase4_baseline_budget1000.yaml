exper_name: "Stellarator_VMEC_Phase4_Baseline_Budget1000"
description: "FusionOpt v1 baseline (no LLM-SemOp) for Phase4 comparison."
resume: false

model:
  provider: gemini
  name: gemini-2.5-pro
  api_key: ""

goals: [volume, aspect_ratio, magnetic_shear]
optimization_direction: [max, min, max]

evalutor_path: problem.stellarator_vmec.evaluator

vmec:
  template_project_path: "/home/dataset-assist-0/MOLLM-main/problem/stellarator_vmec/vmecpp/calculations_nsga2"
  project_path: "/home/dataset-assist-0/MOLLM-main/problem/stellarator_vmec/vmecpp/calculations_nsga2"
  input_file: "input.w7x"
  output_file: "wout_w7x_fusionopt_phase4_budget1000.nc"
  save_wout_mode: 'none'
  save_wout_top_k: 10

optimization:
  pop_size: 10
  eval_budget: 1000
  log_freq: 10

objective_ranges:
  volume: [10.0, 45.0]
  aspect_ratio: [8.0, 15.0]
  magnetic_shear: [0.1, 0.8]

llm_constraints:
  max_coeff_changes: 12
  low_order_max_rel_change: 0.03
  high_order_max_rel_change: 0.08

protocol:
  problem_id: "stellarator_vmec"
  algo_id: "fusionopt_v1"

seed:
  master: 42

logging:
  results_base_dir: "./results/stellarator_vmec"

fusionopt:
  use_heu_repair: true
  heu_repair:
    prob: 1.0
    vmec:
      high_order_shrink: 0.5
      max_total_rel_change: 0.5
  offspring_per_gen: 10
  batch_eval_size: 10
  max_attempts_per_child: 50
  operator_weights:
    std_crossover: 0.7
    std_mutation: 0.3
    std_resample: 0.0
    llm_semop: 0.0
  llm_semop:
    enabled: false
    trigger:
      type: fixed_interval
      every_n_generations: 5
    batch_size: 8
    temperature: 0.0
    schema_version: v1
  gate:
    dedup_scope: "run"
    canonicalize_json: true
